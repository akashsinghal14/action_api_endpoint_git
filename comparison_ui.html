<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Door API Comparison Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-col {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .api-result {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .api-result.openai {
            border-color: #10a37f;
        }

        .api-result.claude {
            border-color: #d97706;
        }

        .api-header {
            padding: 20px;
            font-weight: 600;
            font-size: 1.2em;
            text-align: center;
        }

        .api-header.openai {
            background: linear-gradient(135deg, #10a37f 0%, #0d8a6b 100%);
            color: white;
        }

        .api-header.claude {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: white;
        }

        .api-content {
            padding: 20px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status.compliant {
            background: #d4edda;
            color: #155724;
        }

        .status.non-compliant {
            background: #f8d7da;
            color: #721c24;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f1f3f4;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 600;
            color: #2c3e50;
        }

        .metric-value {
            color: #6c757d;
        }

        .cost {
            font-weight: 700;
            color: #28a745;
        }

        .action-items {
            margin-top: 20px;
        }

        .action-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
        }

        .action-item.high {
            border-left-color: #dc3545;
        }

        .action-item.medium {
            border-left-color: #ffc107;
        }

        .action-item.low {
            border-left-color: #28a745;
        }

        .action-item h4 {
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .action-item p {
            color: #6c757d;
            margin-bottom: 10px;
        }

        .remediation-options {
            margin-top: 10px;
        }

        .remediation-option {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }

        .remediation-option strong {
            color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .empty {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- <div class="header">
            <h1>🔥 Fire Door API Comparison</h1>
            <p>Compare OpenAI vs Claude responses for fire door measurements</p>
        </div> -->

        <div class="controls">
            <div class="form-row">
                <div class="form-col">
                    <label for="apiType">Measurement Type:</label>
                    <select id="apiType">
                        <option value="">Select measurement type...</option>
                        <option value="head">Head Gap</option>
                        <option value="hinge">Hinge Gap</option>
                        <option value="closing">Closing Gap</option>
                        <option value="threshold">Threshold Gap</option>
                        <option value="doorthick">Door Thickness</option>
                        <option value="framedepth">Frame Depth</option>
                        <option value="doorsize">Door Size</option>
                        <option value="intustrips">Intumescent Strips</option>
                        <option value="selfclosing">Self-Closing Device</option>
                        <option value="shutsign">Keep Shut Sign</option>
                        <option value="holddevice">Hold Open Device</option>
                        <option value="certivisible">Certification Visible</option>
                        <option value="glazing">Contains Glazing</option>
                        <option value="pyroglazing">Pyro Glazing</option>
                    </select>
                </div>
                <div class="form-col">
                    <label for="value">Value:</label>
                    <input type="text" id="value" placeholder="e.g., 5, 22, yes, no">
                </div>
                <div class="form-col">
                    <label for="unit">Unit (for numeric values):</label>
                    <input type="text" id="unit" placeholder="mm" value="mm">
                </div>
            </div>
            <div class="form-row">
                <div class="form-col">
                    <label for="openaiKey">OpenAI API Key:</label>
                    <input type="password" id="openaiKey" value="">
                </div>
                <div class="form-col">
                    <label for="claudeKey">Claude API Key:</label>
                    <input type="password" id="claudeKey" value="">
                </div>
                <div class="form-col">
                    <label for="model">Model (optional):</label>
                    <input type="text" id="model" placeholder="gpt-4o, claude-sonnet-4-20250514">
                </div>
            </div>
            <button class="btn" onclick="compareAPIs()">Compare APIs</button>
        </div>

        <div class="results" id="results">
            <div class="empty">
                Select a measurement type and click "Compare APIs" to see results
            </div>
        </div>
    </div>

    <script>
        async function compareAPIs() {
            const apiType = document.getElementById('apiType').value;
            const value = document.getElementById('value').value;
            const unit = document.getElementById('unit').value;
            const openaiKey = document.getElementById('openaiKey').value;
            const claudeKey = document.getElementById('claudeKey').value;
            const model = document.getElementById('model').value;

            if (!apiType || !value) {
                alert('Please select a measurement type and enter a value');
                return;
            }

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="loading">🔄 Calling OpenAI API...</div>
                <div class="loading">🔄 Calling Claude API...</div>
            `;

            try {
                const [openaiResult, claudeResult] = await Promise.all([
                    callAPI('openai', apiType, value, unit, openaiKey, model),
                    callAPI('claude', apiType, value, unit, claudeKey, model)
                ]);

                displayResults(openaiResult, claudeResult);
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function callAPI(provider, apiType, value, unit, apiKey, model) {
            const baseUrl = window.location.origin;  // Use current domain
            const url = `${baseUrl}/api/action_item/${apiType}/${value}${unit ? '/' + unit : ''}`;
            
            const params = new URLSearchParams();
            if (apiKey) params.append('api_key', apiKey);
            if (model) params.append('model', model);
            params.append('ai_provider', provider);  // Add provider parameter

            const fullUrl = `${url}?${params.toString()}`;
            
            try {
                const response = await fetch(fullUrl);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }
                
                return { provider, data, error: null };
            } catch (error) {
                return { provider, data: null, error: error.message };
            }
        }

        function displayResults(openaiResult, claudeResult) {
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="api-result openai">
                    <div class="api-header openai">🤖 OpenAI (GPT)</div>
                    <div class="api-content">
                        ${formatResult(openaiResult)}
                    </div>
                </div>
                <div class="api-result claude">
                    <div class="api-header claude">🧠 Claude (Anthropic)</div>
                    <div class="api-content">
                        ${formatResult(claudeResult)}
                    </div>
                </div>
            `;
        }

        function formatResult(result) {
            if (result.error) {
                return `<div class="error">Error: ${result.error}</div>`;
            }

            const data = result.data;
            if (!data) {
                return `<div class="empty">No data received</div>`;
            }

            const compliantClass = data.compliant ? 'compliant' : 'non-compliant';
            const compliantText = data.compliant ? '✅ Compliant' : '❌ Non-Compliant';

            let html = `
                <div class="status ${compliantClass}">${compliantText}</div>
                
                <div class="metric">
                    <span class="metric-label">Measurement:</span>
                    <span class="metric-value">${data.value}${data.unit ? ' ' + data.unit : ''}</span>
                </div>
            `;

            if (data.actionItems && data.actionItems.length > 0) {
                html += '<div class="action-items">';
                data.actionItems.forEach(item => {
                    html += `
                        <div class="action-item ${item.severity}">
                            <h4>${item.category}</h4>
                            <p><strong>Description:</strong> ${item.actionDescription}</p>
                            <p><strong>Due Date:</strong> ${item.dueDate}</p>
                            <p><strong>Confidence:</strong> ${item.confidenceScore}%</p>
                            ${item.remediationOptions ? `
                                <div class="remediation-options">
                                    <strong>Remediation Options:</strong>
                                    ${item.remediationOptions.map(option => `
                                        <div class="remediation-option">
                                            <strong>${option.option}:</strong> ${option.plan}
                                        </div>
                                    `).join('')}
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                html += '</div>';
            } else if (data.compliant) {
                html += '<div class="empty">✅ No action items required - measurement is compliant</div>';
            } else {
                html += '<div class="empty">No action items available</div>';
            }

            return html;
        }

        // Auto-fill unit based on API type
        document.getElementById('apiType').addEventListener('change', function() {
            const unitInput = document.getElementById('unit');
            const valueInput = document.getElementById('value');
            
            if (['intustrips', 'selfclosing', 'shutsign', 'holddevice', 'certivisible', 'glazing', 'pyroglazing'].includes(this.value)) {
                unitInput.value = '';
                unitInput.placeholder = 'yes/no';
                valueInput.placeholder = 'yes or no';
            } else {
                unitInput.value = 'mm';
                unitInput.placeholder = 'mm';
                valueInput.placeholder = 'e.g., 5, 22';
            }
        });
    </script>
</body>
</html>
